plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.15.5'
    id 'maven-publish'
}
version = "${mod_version}+${minecraft_version}"
layout.buildDirectory = layout.projectDirectory.dir("build/${minecraft_version}")
group = 'ru.robloxgang'
base { archivesName = 'robloxgang-utilities' }
repositories { mavenCentral(); maven { url = 'https://maven.terraformersmc.com/releases/' } }
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation "com.terraformersmc:modmenu:${modmenu_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
if (minecraft_version == '1.21.11') {
    def adaptedJava = layout.buildDirectory.dir('generated/sources/12111')
    tasks.register('adapt12111', Copy) {
        from 'src/main/java'; into adaptedJava
        filter { line -> line.replace('ResourceLocation', 'Identifier').replace('void renderWidget(', 'void renderContents(').replace('Lnet/minecraft/util/FormattedCharSequence;FFIZI)', 'Lnet/minecraft/util/FormattedCharSequence;FFIZZI)').replace('x,y,color,shadow,background)', 'x,y,color,shadow,false,background)') }
    }
    sourceSets.main.java.setSrcDirs([adaptedJava])
    compileJava.dependsOn 'adapt12111'
    tasks.withType(Jar).configureEach { if (name == 'sourcesJar') dependsOn 'adapt12111' }
}
processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft', minecraft_version
    inputs.property 'loader', loader_version
    filesMatching('fabric.mod.json') { expand(version: project.version, minecraft: minecraft_version,loader:loader_version) }
}
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
test { useJUnitPlatform() }
jar { from('LICENSE'); from('MEDIA-LICENSES.md') }
apply from: 'smoke.gradle'
