name: Build and test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.matrix.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: matrix
        name: Read pinned Minecraft versions
        shell: pwsh
        run: ./scripts/ci-matrix.ps1

  build:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    name: Minecraft ${{ matrix.minecraft }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Make wrapper executable
        run: chmod +x gradlew
      - name: Build, test and inspect JAR
        shell: pwsh
        env:
          MINECRAFT_VERSION: ${{ matrix.minecraft }}
        run: ./scripts/build-one.ps1 -MinecraftVersion $env:MINECRAFT_VERSION
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mod-${{ matrix.minecraft }}
          path: dist/**/*.jar
          if-no-files-found: error
          retention-days: 14
      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.minecraft }}
          path: build/${{ matrix.minecraft }}/test-results/test/*.xml
          if-no-files-found: ignore
          retention-days: 14
